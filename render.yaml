services:
  # ============================================================================
  # Cortex API Gateway
  # ============================================================================
  - type: web
    name: cortex-gateway
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/gateway/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8000"
      # Note: all 5 services must share the same INTERNAL_API_KEY value
      - key: INTERNAL_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      # AUTH_SERVICE must be the full https:// URL without a trailing slash (e.g. https://cortex-auth.onrender.com)
      - key: AUTH_SERVICE
        sync: false
      # CHAT_SERVICE must be the full https:// URL without a trailing slash (e.g. https://cortex-chat.onrender.com)
      - key: CHAT_SERVICE
        sync: false
      # AGENT_SERVICE must be the full https:// URL without a trailing slash (e.g. https://cortex-agent.onrender.com)
      - key: AGENT_SERVICE
        sync: false
      # BILLING_SERVICE must be the full https:// URL without a trailing slash (e.g. https://cortex-billing.onrender.com)
      - key: BILLING_SERVICE
        sync: false

  # ============================================================================
  # Cortex Auth Service
  # ============================================================================
  - type: web
    name: cortex-auth
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/services/auth/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8001"
      # Note: all 5 services must share the same INTERNAL_API_KEY value
      - key: INTERNAL_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

  # ============================================================================
  # Cortex Chat Service
  # ============================================================================
  - type: web
    name: cortex-chat
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/services/chat/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8002"
      # Note: all 5 services must share the same INTERNAL_API_KEY value
      - key: INTERNAL_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false

  # ============================================================================
  # Cortex Agent Service
  # ============================================================================
  - type: web
    name: cortex-agent
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/services/agent/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8003"
      # Note: all 5 services must share the same INTERNAL_API_KEY value
      - key: INTERNAL_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      # AUTH_SERVICE must be the full https:// URL without a trailing slash (e.g. https://cortex-auth.onrender.com)
      - key: AUTH_SERVICE
        sync: false
      # CHAT_SERVICE must be the full https:// URL without a trailing slash (e.g. https://cortex-chat.onrender.com)
      - key: CHAT_SERVICE
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_KEY
        sync: false
      - key: AWS_BUCKET_NAME
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false

  # ============================================================================
  # Cortex Billing Service
  # ============================================================================
  - type: web
    name: cortex-billing
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/services/billing/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8004"
      # Note: all 5 services must share the same INTERNAL_API_KEY value
      - key: INTERNAL_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      # AUTH_SERVICE must be the full https:// URL without a trailing slash (e.g. https://cortex-auth.onrender.com)
      - key: AUTH_SERVICE
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
